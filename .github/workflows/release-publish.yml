name: Release Publish
on:
  workflow_run:
    workflows:
    - SemVer Release
    types:
    - completed
    branches:
    - main
    - master
  workflow_dispatch: null
env:
  REGISTRY: ghcr.io
jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: ${{ vars.QA_ARMED == 'true' && github.sha != vars.QA_BOOTSTRAP_SHA && (github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success') }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      should_publish: ${{ steps.version.outputs.should_publish }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: master
        fetch-depth: 0
    - name: Verify master is at the latest stable tag
      id: version
      run: "set -euo pipefail\n\n# Resolve the latest stable tag. A real failure (corrupt repo, shallow\n# clone missing tags,\
        \ etc.) should fail loudly \u2014 only exit-code 128\n# from `git describe` means \"no matching tags exist in history\"\
        \ and is\n# benign for a fresh repo with no stable releases yet.\nset +e\nLATEST_TAG=$(git describe --tags --abbrev=0\
        \ --match 'v[0-9]*' --exclude '*dev*' 2>&1)\nDESCRIBE_RC=$?\nset -e\nif [ \"$DESCRIBE_RC\" -eq 128 ]; then\n  echo\
        \ \"::warning::No stable tag found; skipping Release Publish.\"\n  echo \"should_publish=false\" >> \"$GITHUB_OUTPUT\"\
        \n  echo \"version=\" >> \"$GITHUB_OUTPUT\"\n  echo \"release_tag=\" >> \"$GITHUB_OUTPUT\"\n  echo \"## Release Publish\
        \ skipped\" >> \"$GITHUB_STEP_SUMMARY\"\n  echo \"No stable tag found in repository.\" >> \"$GITHUB_STEP_SUMMARY\"\
        \n  exit 0\nelif [ \"$DESCRIBE_RC\" -ne 0 ]; then\n  echo \"::error::git describe failed (rc=$DESCRIBE_RC): $LATEST_TAG\"\
        \n  exit \"$DESCRIBE_RC\"\nfi\necho \"release_tag=$LATEST_TAG\" >> \"$GITHUB_OUTPUT\"\necho \"Latest stable tag: $LATEST_TAG\"\
        \n\n# Read the version from pyproject.toml AT THE TAG, not master HEAD, so\n# we publish what was tagged even if master\
        \ has advanced. Prevents the\n# \"workflow_dispatch bumped pyproject ahead of tag\" corner case.\nVERSION=$(git show\
        \ \"$LATEST_TAG:pyproject.toml\" \\\n  | grep '^version = ' | sed 's/version = \"\\(.*\\)\"/\\1/')\nif [ -z \"$VERSION\"\
        \ ]; then\n  echo \"::error::Could not parse version from $LATEST_TAG:pyproject.toml\"\n  exit 1\nfi\necho \"version=$VERSION\"\
        \ >> \"$GITHUB_OUTPUT\"\necho \"Tagged pyproject version: $VERSION\"\n\nTAG_SHA=$(git rev-list -n 1 \"$LATEST_TAG\"\
        )\nHEAD_SHA=$(git rev-parse HEAD)\n\n# Normal release weeks: semver-release tags the release commit, then\n# pushes\
        \ follow-up housekeeping commits to master (changelog sync,\n# addon version bump \u2014 all `[skip ci]`). HEAD !=\
        \ tag in that case,\n# but the release IS current. Mirror semver-release.yml's check-changes\n# logic: block only\
        \ if there are releasable commits\n# on master since the tag that would have produced a new version.\nRELEASABLE=$(git\
        \ log \"$LATEST_TAG..HEAD\" --oneline -E \\\n  --grep='^(feat|fix|perf|refactor)(\\(.+\\))?!?:' \\\n  --grep='^[a-z]+(\\\
        (.+\\))?!:' \\\n  --grep='^BREAKING[ -]CHANGE:' || true)\n\nif [ -n \"$RELEASABLE\" ]; then\n  if [ \"${{ github.event_name\
        \ }}\" = \"workflow_dispatch\" ]; then\n    echo \"::notice::Manual dispatch: unreleased commits exist on master since\
        \ $LATEST_TAG. Forcing republish of $LATEST_TAG from the tag ref (master HEAD $HEAD_SHA is being ignored).\"\n   \
        \ echo \"## Release Publish \u2014 forced republish\" >> \"$GITHUB_STEP_SUMMARY\"\n    echo \"Building \\`$LATEST_TAG\\\
        ` ($TAG_SHA); unreleased commits on master were ignored.\" >> \"$GITHUB_STEP_SUMMARY\"\n  else\n    echo \"::notice::Unreleased\
        \ commits exist on master since $LATEST_TAG; no new release to publish \u2014 skipping.\"\n    echo \"should_publish=false\"\
        \ >> \"$GITHUB_OUTPUT\"\n    echo \"## Release Publish skipped\" >> \"$GITHUB_STEP_SUMMARY\"\n    echo \"master has\
        \ releasable commits since the latest stable tag \\`$LATEST_TAG\\` but no new tag was cut, so republishing \\`$LATEST_TAG\\\
        ` would be misleading.\" >> \"$GITHUB_STEP_SUMMARY\"\n    echo \"This is expected on biweekly-gate odd weeks; the\
        \ re-triggered \\`workflow_run\\` is being correctly ignored.\" >> \"$GITHUB_STEP_SUMMARY\"\n    exit 0\n  fi\nfi\n\
        \necho \"should_publish=true\" >> \"$GITHUB_OUTPUT\"\necho \"Release version: $VERSION (tag $LATEST_TAG)\"\necho \"\
        ## Release Publish \u2014 $VERSION\" >> \"$GITHUB_STEP_SUMMARY\"\necho \"Building from tag \\`$LATEST_TAG\\` ($TAG_SHA).\"\
        \ >> \"$GITHUB_STEP_SUMMARY\"\nif [ \"$TAG_SHA\" != \"$HEAD_SHA\" ]; then\n  echo \"(master HEAD is $HEAD_SHA \u2014\
        \ post-tag housekeeping commits only, no releasable changes.)\" >> \"$GITHUB_STEP_SUMMARY\"\nfi\n"
  publish_pypi:
    name: Publish PyPI package
    needs: prepare
    if: ${{ needs.prepare.outputs.should_publish == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://julienld.github.io/ha-mcp-simple-mirror-qa-20261108
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ needs.prepare.outputs.release_tag }}
        fetch-depth: 0
        submodules: true
    - name: Install uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
      with:
        version: 0.13.4
    - name: Build distribution
      run: uv build
    - name: Publish package to the isolated QA index
      run: uv run -s .qa/runtime.py publish-index --dist dist
      env:
        QA_DEPLOY_KEY: ${{ secrets.INTEGRATION_MIRROR_DEPLOY_KEY }}
    - name: Wait for the build on PyPI
      run: "for _ in $(seq 1 60); do\n  if curl -fsS -o /dev/null \"https://julienld.github.io/ha-mcp-simple-mirror-qa-20261108/pypi/ha-mcp/${VERSION}/json\"\
        ; then\n    echo \"PyPI serves ha-mcp ${VERSION}\"\n    exit 0\n  fi\n  sleep 30\ndone\necho \"::error::PyPI never\
        \ served ha-mcp ${VERSION}; leaving the release draft.\"\nexit 1\n"
    - name: Generate GitHub App token for publication
      id: app-token
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
      with:
        app-id: ${{ secrets.RELEASE_APP_ID }}
        private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        permission-contents: write
      continue-on-error: true
      if: ${{ github.repository == 'homeassistant-ai/ha-mcp' }}
    - name: Publish GitHub release
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        TAG: ${{ needs.prepare.outputs.release_tag }}
      run: gh release edit "$TAG" --draft=false
  publish_docker:
    name: Publish Docker image
    needs:
    - prepare
    - publish_pypi
    if: ${{ needs.prepare.outputs.should_publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ needs.prepare.outputs.release_tag }}
        fetch-depth: 0
        submodules: true
    - name: QA controlled failure after GitHub finalization
      if: ${{ vars.QA_FAIL_DOCKER == 'true' }}
      run: echo 'Controlled QA failure after finalization'; exit 1
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Extract metadata for Docker
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
      with:
        images: ${{ env.REGISTRY }}/${{ github.repository }}
        tags: 'type=semver,pattern={{version}},value=${{ env.VERSION }}

          type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }}

          type=semver,pattern={{major}},value=${{ env.VERSION }}

          type=raw,value=latest

          type=raw,value=stable

          '
    - name: Build and push Docker image
      uses: ./.github/actions/docker-build-python-base-fallback
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        platforms: linux/amd64
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: 'BUILD_VERSION=${{ env.VERSION }}

          '
  publish_mcp:
    name: Publish MCP server manifest
    needs:
    - publish_pypi
    - publish_docker
    - prepare
    runs-on: ubuntu-latest
    if: ${{ always() && needs.prepare.outputs.should_publish == 'true' }}
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      IMAGE: ghcr.io/${{ github.repository }}:${{ needs.prepare.outputs.version }}
    steps:
    - name: Report upstream job results
      run: 'echo "PyPI publish conclusion: ${{ needs.publish_pypi.result }}"

        echo "Docker publish conclusion: ${{ needs.publish_docker.result }}"

        '
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      if: ${{ needs.publish_pypi.result == 'success' && needs.publish_docker.result == 'success' }}
      with:
        persist-credentials: false
        ref: ${{ needs.prepare.outputs.release_tag }}
        fetch-depth: 0
    - name: Install MCP Publisher CLI
      if: ${{ github.repository == 'homeassistant-ai/ha-mcp' }}
      env:
        MCP_PUBLISHER_VERSION: v1.7.9
        MCP_PUBLISHER_SHA256: ab128162b0616090b47cf245afe0a23f3ef08936fdce19074f5ba0a4469281ac
      run: "set -euo pipefail\nos=\"$(uname -s | tr '[:upper:]' '[:lower:]')\"\narch=\"$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')\"\
        \ncurl -fsSL -o mcp-publisher.tar.gz \\\n  \"https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_${os}_${arch}.tar.gz\"\
        \necho \"${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz\" | sha256sum -c -\ntar xzf mcp-publisher.tar.gz mcp-publisher\n"
    - name: Render server manifest for publish
      if: ${{ needs.publish_pypi.result == 'success' && needs.publish_docker.result == 'success' }}
      run: "set -euo pipefail\npython scripts/render_server_manifest.py \\\n  --input server.json \\\n  --output server.json\
        \ \\\n  --version \"$VERSION\" \\\n  --oci-image \"$IMAGE\"\ncat server.json\n"
    - name: Install uv
      if: ${{ needs.publish_pypi.result == 'success' && needs.publish_docker.result == 'success' }}
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
      with:
        version: 0.13.4
    - name: Validate server manifest
      if: ${{ needs.publish_pypi.result == 'success' && needs.publish_docker.result == 'success' }}
      run: 'set -euo pipefail

        uv run --frozen python scripts/validate_server_manifest.py server.json

        '
    - name: Login to MCP Registry
      if: ${{ github.repository == 'homeassistant-ai/ha-mcp' }}
      run: ./mcp-publisher login github-oidc
    - name: Retain the rendered MCP manifest without public registration
      if: ${{ needs.publish_pypi.result == 'success' && needs.publish_docker.result == 'success' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: qa-mcp-manifest
        path: server.json
    - name: Skip MCP publish
      if: ${{ needs.publish_pypi.result != 'success' || needs.publish_docker.result != 'success' }}
      run: 'echo "Skipping MCP publish because one or more upstream publish jobs failed."

        '
  qa_receipt:
    name: QA workflow receipt
    needs:
    - prepare
    - publish_pypi
    - publish_docker
    - publish_mcp
    if: ${{ always() && vars.QA_ARMED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.workflow_sha }}
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
      with:
        version: 0.13.4
    - run: uv run -s .qa/record.py
      env:
        QA_NEEDS: ${{ toJSON(needs) }}
        QA_STAGE: ${{ vars.QA_STAGE }}
        GH_TOKEN: ${{ github.token }}
        QA_REPORT_FAILURES: 'false'
        QA_OBSERVER_PR: ${{ vars.QA_OBSERVER_PR }}
        QA_OBSERVER_SHA: ${{ vars.QA_OBSERVER_SHA }}
        QA_FAIL_DOCKER: ${{ vars.QA_FAIL_DOCKER }}
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: qa-workflow-receipt
        path: qa-workflow-receipt.json
        retention-days: 30
