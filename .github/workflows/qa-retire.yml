name: QA Retire Container Packages
on:
  push:
    branches: [master]
    paths: [.github/workflows/qa-retire.yml]
  workflow_dispatch:
    inputs:
      delete:
        type: boolean
        default: false
permissions:
  contents: read
  packages: write
jobs:
  retire:
    if: ${{ github.repository == 'julienld/ha-mcp-simple-release-qa-20261108' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
      with:
        version: 0.13.4
    - name: Inspect or retire exact QA container packages
      run: 'ARGS=(); if [ "$DELETE" = true ]; then ARGS=(--delete); fi

        uv run -s .qa/retire.py "${ARGS[@]}"'
      env:
        GH_TOKEN: ${{ github.token }}
        DELETE: ${{ inputs.delete }}
        QA_ARMED: ${{ vars.QA_ARMED }}
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: ${{ always() }}
      with:
        name: qa-container-retirement
        path: qa-container-retirement.json
        retention-days: 30
